<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515">
<title>Web service: public entry and private services</title>
<desc>Internet clients connect over HTTPS to a public load balancer. The load balancer connects to App A and App B in the private zone; both applications connect to one database. Lines are bidirectional logical connections, not a packet timeline.</desc>
<rect id="public-zone" x="260" y="70" width="210" height="355" fill="#f3f4f6" stroke="#8997a5" stroke-width="2"/>
<rect id="private-zone" x="510" y="70" width="430" height="355" fill="#f0f5fa" stroke="#8997a5" stroke-width="2"/>
<text x="365" y="108" text-anchor="middle" font-size="18">Public entry</text>
<text x="725" y="108" text-anchor="middle" font-size="18">Private services</text>
<text x="112" y="208" text-anchor="middle" font-size="18">Internet</text>
<path id="clients-to-balancer" d="M 200 260 H 280" fill="none" stroke="#30465d" stroke-width="2.5" stroke-linejoin="round"/>
<path id="balancer-to-app-a" d="M 445 260 H 485 V 180 H 535" fill="none" stroke="#30465d" stroke-width="2.5" stroke-linejoin="round"/>
<path id="balancer-to-app-b" d="M 485 260 V 340 H 535" fill="none" stroke="#30465d" stroke-width="2.5" stroke-linejoin="round"/>
<path id="app-a-to-database" d="M 685 180 H 735 V 260 H 775" fill="none" stroke="#30465d" stroke-width="2.5" stroke-linejoin="round"/>
<path id="app-b-to-database" d="M 685 340 H 735 V 260" fill="none" stroke="#30465d" stroke-width="2.5" stroke-linejoin="round"/>
<rect id="clients" x="25" y="225" width="175" height="70" fill="#dbeafe" stroke="#30465d" stroke-width="2"/>
<text x="112.5" y="267.0" text-anchor="middle" font-size="20">Clients</text>
<rect id="load-balancer" x="280" y="225" width="165" height="70" fill="#dbeafe" stroke="#30465d" stroke-width="2"/>
<text x="362.5" y="254.5" text-anchor="middle" font-size="20">Load</text>
<text x="362.5" y="279.5" text-anchor="middle" font-size="20">balancer</text>
<rect id="app-a" x="535" y="145" width="150" height="70" fill="#dbeafe" stroke="#30465d" stroke-width="2"/>
<text x="610.0" y="187.0" text-anchor="middle" font-size="20">App A</text>
<rect id="app-b" x="535" y="305" width="150" height="70" fill="#dbeafe" stroke="#30465d" stroke-width="2"/>
<text x="610.0" y="347.0" text-anchor="middle" font-size="20">App B</text>
<rect id="database" x="775" y="225" width="145" height="70" fill="#fef3c7" stroke="#30465d" stroke-width="2"/>
<text x="847.5" y="267.0" text-anchor="middle" font-size="20">Database</text>
<text x="240" y="246" text-anchor="middle" font-size="14">HTTPS</text>
<text x="610" y="393" text-anchor="middle" font-size="14">App links</text>
<text x="845" y="393" text-anchor="middle" font-size="14">DB links</text>
<text x="25" y="463" text-anchor="start" font-size="17">Lines = bidirectional logical connections.</text>
<text x="25" y="490" text-anchor="start" font-size="15">One database is shown; replication and failover are omitted.</text>
</svg>
